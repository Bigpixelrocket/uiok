# Publishes @bigpixelrocket/uiok to npm when a GitHub Release is published. The release's tag
# must be `v` plus package.json's version. Publishing authenticates through npm
# Trusted Publishing (OIDC), so the repository holds no npm token, and npm
# attaches a provenance statement. See docs/releasing.md.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # The tag reaches the script through the environment, never the shell's text.
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Release tag $TAG does not match package.json ($expected)."
            exit 1
          fi

      # Trusted Publishing needs npm 11.5.1 or newer.
      - name: Ensure npm supports Trusted Publishing
        run: |
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install --global npm@^11.5.1
          fi
          npm --version

      - run: npm ci
      - run: npm run check

      # The gate just ran, so lifecycle scripts (prepublishOnly) are skipped.
      - run: npm publish --provenance --access public --ignore-scripts
