# Runs the full gate (`pnpm run check`: typecheck, lint, formatting, tests,
# build, and the publish guard) and builds the documentation site on every
# pull request and every push to main. On a pull request it first checks that
# a change to the published package bumps the version (scripts/version.mjs).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version check diffs against the pull request's base commit.
          fetch-depth: 0
      # Node, pnpm, and every other tool in mise.toml at the versions in mise.lock.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      # pnpm's package store, keyed on the lockfile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The base commit reaches the script through the environment, never the shell's text.
      - name: Check the version bump
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/version.mjs check "$BASE_SHA"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # The documentation site builds from the same source, with no source maps.
      - run: pnpm run site:build
